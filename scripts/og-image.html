<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<!-- Social preview card (1200x630). Rendered to public/og-image-2026.png by scripts/og-image.mjs.
     Colors and fonts mirror the site's "bone" theme tokens in src/styles/styles.css. -->
<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-weight: 500;
    src: url('../public/fonts/space-grotesk-latin.woff2') format('woff2');
  }
  :root {
    --bg: #f4f1ea;
    --ink: #161513;
    --ink-2: #3a3631;
    --ink-3: #6e6860;
    --rule: rgba(22, 21, 19, 0.16);
    --accent: #c26b4c;
    --display: 'Space Grotesk', system-ui, sans-serif;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: var(--bg);
    color: var(--ink);
    padding: 56px 72px 52px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }
  .mono-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 21px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .label { display: flex; align-items: center; gap: 14px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); }
  .name {
    font-family: var(--display);
    font-weight: 500;
    font-size: 92px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-left: -3px;
  }
  .name .period { color: var(--accent); }
  .tagline {
    margin-top: 22px;
    font-family: var(--display);
    font-weight: 500;
    font-size: 38px;
    letter-spacing: -0.01em;
    color: var(--ink-2);
  }
  .foot { border-top: 1px solid var(--rule); padding-top: 24px; }
  .foot .mono-row { font-size: 19px; }
  .foot .left { color: var(--ink-2); }
</style>
</head>
<body>
  <div class="mono-row">
    <div class="label"><span class="dot"></span><span>Computer Engineering undergraduate</span></div>
  </div>

  <div>
    <h1 class="name">S. Kaan Oguzkan<span class="period">.</span></h1>
    <p class="tagline">Computing for genomics and learning.</p>
  </div>

  <div class="foot">
    <div class="mono-row">
      <span class="left">Bilkent University · Alkan Lab</span>
      <span>kaanoguzkan.com</span>
    </div>
  </div>
</body>
</html>
