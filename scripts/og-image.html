<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #0f172a;
    font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Glow blobs */
  .glow-1 {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(56,189,248,0.08) 0%, transparent 70%);
    top: -80px;
    right: -80px;
    border-radius: 50%;
  }
  .glow-2 {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(167,139,250,0.07) 0%, transparent 70%);
    bottom: -60px;
    left: 80px;
    border-radius: 50%;
  }

  /* Code window */
  .window {
    position: relative;
    z-index: 1;
    width: 980px;
    background: rgba(30,41,59,0.7);
    border: 1px solid rgba(148,163,184,0.12);
    border-radius: 12px;
    overflow: hidden;
    backdrop-filter: blur(12px);
  }

  /* Window title bar */
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 20px;
    background: rgba(15,23,42,0.8);
    border-bottom: 1px solid rgba(148,163,184,0.08);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .dot-red    { background: #ff5f57; }
  .dot-yellow { background: #febc2e; }
  .dot-green  { background: #28c840; }
  .filename {
    margin-left: 12px;
    color: #64748b;
    font-size: 13px;
  }

  /* Code body */
  .code {
    padding: 36px 48px 40px;
    font-size: 22px;
    line-height: 1.75;
  }

  .line { display: flex; align-items: baseline; gap: 0; }
  .ln { color: #334155; width: 28px; flex-shrink: 0; user-select: none; font-size: 14px; margin-right: 24px; text-align: right; }

  /* Syntax colors */
  .kw   { color: #a78bfa; }   /* keyword: const, => */
  .fn   { color: #38bdf8; }   /* function / property names */
  .str  { color: #4ade80; }   /* strings */
  .num  { color: #fb923c; }   /* numbers */
  .punc { color: #94a3b8; }   /* punctuation */
  .cmt  { color: #475569; font-style: italic; } /* comment */
  .name-cyan { color: #38bdf8; font-weight: 700; }
  .name-violet { color: #a78bfa; font-weight: 700; }

  /* Bottom URL bar */
  .url-bar {
    position: absolute;
    bottom: 28px;
    right: 48px;
    color: #334155;
    font-size: 15px;
    font-family: monospace;
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="window">
    <div class="titlebar">
      <div class="dot dot-red"></div>
      <div class="dot dot-yellow"></div>
      <div class="dot dot-green"></div>
      <span class="filename">developer.ts</span>
    </div>
    <div class="code">
      <div class="line"><span class="ln">1</span><span class="cmt">// kaanoguzkan.com</span></div>
      <div class="line"><span class="ln">2</span></div>
      <div class="line"><span class="ln">3</span><span class="kw">const</span>&nbsp;<span class="fn">developer</span>&nbsp;<span class="punc">= {</span></div>
      <div class="line"><span class="ln">4</span>&nbsp;&nbsp;<span class="fn">name</span><span class="punc">:&nbsp;</span><span class="str">"</span><span class="name-cyan">S. Kaan</span><span class="name-violet">&nbsp;Oguzkan</span><span class="str">"</span><span class="punc">,</span></div>
      <div class="line"><span class="ln">5</span>&nbsp;&nbsp;<span class="fn">role</span><span class="punc">: </span><span class="str">"Software Engineer &amp; CS Student"</span><span class="punc">,</span></div>
      <div class="line"><span class="ln">6</span>&nbsp;&nbsp;<span class="fn">stack</span><span class="punc">: [</span><span class="str">"React"</span><span class="punc">, </span><span class="str">"Node.js"</span><span class="punc">, </span><span class="str">"TypeScript"</span><span class="punc">, </span><span class="str">"AWS"</span><span class="punc">],</span></div>
      <div class="line"><span class="ln">7</span>&nbsp;&nbsp;<span class="fn">education</span><span class="punc">: </span><span class="str">"Bilkent University"</span><span class="punc">,</span></div>
      <div class="line"><span class="ln">8</span><span class="punc">};</span></div>
    </div>
  </div>

  <div class="url-bar">kaanoguzkan.com</div>
</body>
</html>
