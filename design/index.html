<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>S. Kaan Oguzkan — Software Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f1ea;
    --bg-2: #ece7dc;
    --ink: #161513;
    --ink-2: #3a3631;
    --ink-3: #6e6860;
    --rule: #1615131a;
    --accent: oklch(0.62 0.12 40);
    --accent-soft: oklch(0.62 0.12 40 / 0.12);
    --warn: oklch(0.62 0.12 140);
    --display: 'Space Grotesk', system-ui, sans-serif;
    --body: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  [data-theme="ink"] {
    --bg: #15140f;
    --bg-2: #1d1c17;
    --ink: #f0ece2;
    --ink-2: #c8c2b4;
    --ink-3: #8a857a;
    --rule: #f0ece21f;
    --accent: oklch(0.72 0.13 70);
    --accent-soft: oklch(0.72 0.13 70 / 0.16);
  }
  [data-theme="paper"] {
    --bg: #fbfaf6;
    --bg-2: #f3f0e8;
    --ink: #0d0d0c;
    --ink-2: #2a2825;
    --ink-3: #6a6660;
    --rule: #0d0d0c1a;
    --accent: oklch(0.55 0.13 250);
    --accent-soft: oklch(0.55 0.13 250 / 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--body);
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background 0.3s ease, color 0.3s ease;
  }
  a { color: inherit; text-decoration: none; }
  a.link-u {
    position: relative;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 1px;
    transition: color .2s, border-color .2s;
  }
  a.link-u:hover { color: var(--accent); border-color: var(--accent); }

  ::selection { background: var(--accent); color: var(--bg); }

  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .display { font-family: var(--display); font-weight: 500; letter-spacing: -0.02em; }

  /* Layout */
  .shell { max-width: 1320px; margin: 0 auto; padding: 0 48px; }
  @media (max-width: 720px) { .shell { padding: 0 24px; } }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in oklab, var(--bg) 85%, transparent);
    backdrop-filter: saturate(140%) blur(10px);
    -webkit-backdrop-filter: saturate(140%) blur(10px);
    border-bottom: 1px solid var(--rule);
  }
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .brand .dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .nav { display: flex; gap: 28px; font-size: 13px; }
  .nav a { color: var(--ink-2); transition: color .2s; }
  .nav a:hover { color: var(--ink); }
  .nav .now { color: var(--ink-3); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .nav .now::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 0 var(--warn); animation: pulse 2.4s infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 oklch(0.62 0.12 140 / .5); }
    70%  { box-shadow: 0 0 0 8px oklch(0.62 0.12 140 / 0); }
    100% { box-shadow: 0 0 0 0 oklch(0.62 0.12 140 / 0); }
  }
  @media (max-width: 720px) { .nav { gap: 16px; } .nav .now { display: none; } .nav a:not(.cta-mini) { display: none; } }

  /* Hero */
  .hero { padding: 120px 0 80px; position: relative; }
  .hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: end; }
  @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 40px; } }
  .hero h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(48px, 8vw, 116px);
    line-height: 0.95;
    letter-spacing: -0.035em;
    margin: 0 0 32px;
  }
  .hero h1 .accent { font-style: italic; font-weight: 400; color: var(--accent); }
  .hero h1 .strike { text-decoration: line-through; text-decoration-thickness: 4px; color: var(--ink-3); }
  .hero-meta { font-size: 17px; max-width: 460px; color: var(--ink-2); }
  .hero-meta strong { color: var(--ink); font-weight: 600; }
  .hero-side { display: flex; flex-direction: column; gap: 28px; align-items: flex-start; }
  .photo-frame {
    width: 220px; aspect-ratio: 4/5;
    background: var(--bg-2);
    border: 1px solid var(--rule);
    position: relative;
    overflow: hidden;
  }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.85) contrast(1.02); }
  .photo-frame::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 60%, color-mix(in oklab, var(--bg) 30%, transparent) 100%);
    pointer-events: none;
  }
  .photo-cap { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.05em; }

  .hero-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--rule);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-3); gap: 24px; flex-wrap: wrap;
  }
  .hero-row .roles { display: flex; gap: 24px; flex-wrap: wrap; }
  .hero-row .roles span { color: var(--ink); }
  .hero-row .roles span:not(:last-child)::after { content: " ·"; color: var(--ink-3); margin-left: 24px; }

  .typer-cursor {
    display: inline-block; width: 2px; height: 0.85em; background: var(--accent);
    vertical-align: -0.05em; margin-left: 2px; animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Section */
  section.block { padding: 96px 0; border-top: 1px solid var(--rule); }
  .block-head { display: grid; grid-template-columns: 220px 1fr; gap: 48px; margin-bottom: 56px; align-items: baseline; }
  @media (max-width: 720px) { .block-head { grid-template-columns: 1fr; gap: 12px; margin-bottom: 32px; } }
  .block-num { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .block-num .n { color: var(--accent); }
  .block-title { font-family: var(--display); font-weight: 500; font-size: clamp(32px, 4vw, 52px); letter-spacing: -0.025em; line-height: 1.05; margin: 0; }
  .block-title em { font-style: italic; font-weight: 400; color: var(--ink-3); }

  /* About */
  .about-grid { display: grid; grid-template-columns: 220px 1fr; gap: 48px; }
  @media (max-width: 720px) { .about-grid { grid-template-columns: 1fr; gap: 24px; } }
  .about-side { display: flex; flex-direction: column; gap: 28px; }
  .meta-row { display: flex; flex-direction: column; gap: 4px; }
  .meta-row .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .meta-row .v { font-size: 14px; color: var(--ink); }
  .about-body { max-width: 680px; }
  .about-body p { font-size: 19px; line-height: 1.55; color: var(--ink-2); margin: 0 0 18px; }
  .about-body p strong { color: var(--ink); font-weight: 600; }
  .edu-list { display: flex; flex-direction: column; gap: 20px; margin-top: 40px; }
  .edu-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 16px 0; border-top: 1px solid var(--rule); }
  .edu-row:last-child { border-bottom: 1px solid var(--rule); }
  .edu-row .school { font-family: var(--display); font-size: 18px; font-weight: 500; }
  .edu-row .deg { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .edu-row .right { text-align: right; }
  .edu-row .period { font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; color: var(--ink-2); text-transform: uppercase; }
  .edu-row .detail { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
  @media (max-width: 600px) { .edu-row { grid-template-columns: 1fr; } .edu-row .right { text-align: left; } }

  /* Experience */
  .exp { display: grid; grid-template-columns: 220px 1fr; gap: 48px; align-items: start; }
  @media (max-width: 720px) { .exp { grid-template-columns: 1fr; gap: 24px; } }
  .exp-side .when { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.05em; text-transform: uppercase; }
  .exp-side .org { font-family: var(--display); font-size: 22px; font-weight: 500; margin-top: 8px; }
  .exp-side .role { font-size: 14px; color: var(--ink-2); margin-top: 4px; }
  .exp-side .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; padding: 4px 8px; border: 1px solid var(--rule); color: var(--ink-2); border-radius: 2px; }
  .exp-list { display: flex; flex-direction: column; }
  .exp-item {
    padding: 24px 0; border-top: 1px solid var(--rule);
    display: grid; grid-template-columns: 80px 1fr; gap: 24px; align-items: start;
  }
  .exp-item:last-child { border-bottom: 1px solid var(--rule); }
  .exp-item .idx { font-family: var(--mono); font-size: 11px; color: var(--ink-3); padding-top: 4px; }
  .exp-item .body { }
  .exp-item .head { font-family: var(--display); font-size: 17px; font-weight: 500; margin-bottom: 6px; }
  .exp-item .desc { font-size: 14.5px; color: var(--ink-2); line-height: 1.6; }
  .metric-row { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .metric { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; padding: 3px 8px; background: var(--accent-soft); color: var(--accent); border-radius: 2px; }

  /* Projects */
  .proj-list { display: flex; flex-direction: column; }
  .proj {
    display: grid; grid-template-columns: 220px 1fr 200px; gap: 48px;
    padding: 36px 0; border-top: 1px solid var(--rule); align-items: start;
    cursor: pointer; transition: background .25s;
  }
  .proj:hover { background: var(--bg-2); padding-left: 16px; padding-right: 16px; margin-left: -16px; margin-right: -16px; }
  .proj:last-child { border-bottom: 1px solid var(--rule); }
  .proj-meta { display: flex; flex-direction: column; gap: 6px; }
  .proj-meta .num { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
  .proj-meta .status { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); margin-top: 4px; }
  .proj-meta .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
  .proj-meta .status.live .dot { background: var(--warn); }
  .proj-name { font-family: var(--display); font-size: clamp(28px, 3.4vw, 44px); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 10px; }
  .proj-label { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 12px; }
  .proj-desc { font-size: 15px; color: var(--ink-2); line-height: 1.6; max-width: 640px; }
  .proj-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .proj-side { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; padding-top: 6px; }
  .proj-side .arrow { font-family: var(--display); font-size: 32px; color: var(--ink-3); transition: transform .25s, color .25s; }
  .proj:hover .arrow { transform: translateX(4px); color: var(--accent); }
  @media (max-width: 900px) { .proj { grid-template-columns: 1fr; gap: 16px; } .proj-side { align-items: flex-start; } .proj:hover { padding-left: 0; padding-right: 0; margin: 0; } }

  /* Skills */
  .skills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid var(--rule); }
  @media (max-width: 900px) { .skills-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .skills-grid { grid-template-columns: 1fr; } }
  .skill-cat {
    padding: 28px 24px 28px 0;
    border-bottom: 1px solid var(--rule);
    border-right: 1px solid var(--rule);
  }
  .skills-grid .skill-cat:nth-child(3n) { border-right: none; }
  @media (max-width: 900px) {
    .skills-grid .skill-cat { border-right: 1px solid var(--rule); }
    .skills-grid .skill-cat:nth-child(3n) { border-right: 1px solid var(--rule); }
    .skills-grid .skill-cat:nth-child(2n) { border-right: none; }
  }
  @media (max-width: 600px) { .skills-grid .skill-cat { border-right: none !important; } }
  .skill-cat .name { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 16px; }
  .skill-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--display); font-size: 14px; padding: 6px 12px; border: 1px solid var(--rule); border-radius: 999px; color: var(--ink); transition: all .2s; cursor: default; }
  .chip:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* Volunteering */
  .vol-list { display: flex; flex-direction: column; }
  .vol {
    display: grid; grid-template-columns: 200px 1fr 1fr; gap: 32px;
    padding: 22px 0; border-top: 1px solid var(--rule); align-items: baseline;
  }
  .vol:last-child { border-bottom: 1px solid var(--rule); }
  .vol .when { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.04em; }
  .vol .role { font-family: var(--display); font-size: 18px; font-weight: 500; }
  .vol .org { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .vol .desc { font-size: 14px; color: var(--ink-2); line-height: 1.55; }
  @media (max-width: 720px) { .vol { grid-template-columns: 1fr; gap: 6px; } }

  /* Academics */
  .ac-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 720px) { .ac-grid { grid-template-columns: 1fr; } }
  .ac-card {
    border: 1px solid var(--rule);
    padding: 32px;
    background: var(--bg-2);
    display: flex; flex-direction: column; gap: 16px;
    transition: background .25s, border-color .25s;
  }
  .ac-card:hover { background: var(--bg); border-color: var(--ink-3); }
  .ac-card .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
  .ac-card .id { font-family: var(--mono); font-size: 14px; color: var(--ink); }
  .ac-card .name { font-family: var(--display); font-size: 22px; font-weight: 500; }
  .ac-card .note { font-size: 13px; color: var(--ink-2); }
  .ac-card .go { margin-top: auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }

  /* Contact */
  .contact-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 80px; align-items: start; }
  @media (max-width: 900px) { .contact-grid { grid-template-columns: 1fr; gap: 40px; } }
  .contact-big {
    font-family: var(--display); font-weight: 500; font-size: clamp(36px, 5vw, 68px);
    letter-spacing: -0.025em; line-height: 1.05; margin: 0 0 24px;
  }
  .contact-big em { font-style: italic; font-weight: 400; color: var(--accent); }
  .contact-text { font-size: 17px; color: var(--ink-2); max-width: 480px; line-height: 1.55; }
  .contact-side { display: flex; flex-direction: column; gap: 24px; }
  .contact-link {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 0; border-top: 1px solid var(--rule);
    font-family: var(--display); font-size: 18px;
    transition: color .2s, padding .25s;
  }
  .contact-link:last-of-type { border-bottom: 1px solid var(--rule); }
  .contact-link:hover { color: var(--accent); padding-left: 8px; }
  .contact-link .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .contact-link .val { display: flex; align-items: center; gap: 12px; }
  .contact-link .val .arr { font-size: 14px; color: var(--ink-3); transition: transform .2s, color .2s; }
  .contact-link:hover .val .arr { transform: translateX(4px); color: var(--accent); }

  /* Footer */
  footer {
    padding: 56px 0 40px; border-top: 1px solid var(--rule); margin-top: 40px;
    display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end;
  }
  @media (max-width: 720px) { footer { grid-template-columns: 1fr; } }
  footer .colophon { font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; color: var(--ink-3); line-height: 1.7; text-transform: uppercase; }
  footer .colophon strong { color: var(--ink-2); font-weight: 500; }
  footer .sig { font-family: var(--display); font-size: 100px; font-weight: 500; letter-spacing: -0.04em; color: var(--ink); line-height: 0.85; }
  @media (max-width: 720px) { footer .sig { font-size: 72px; } }

  /* GitHub */
  .gh-wrap { border-top: 1px solid var(--rule); padding-top: 32px; }
  .gh-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 20px; }
  .gh-chart { display: block; padding: 24px; background: var(--bg-2); border: 1px solid var(--rule); transition: border-color .2s; }
  .gh-chart:hover { border-color: var(--ink-3); }
  .gh-chart img { width: 100%; height: auto; display: block; }
  .gh-fallback { font-size: 14px; color: var(--ink-2); padding: 24px; text-align: center; }
  .gh-cta { display: inline-block; margin-top: 24px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 10px 16px; border: 1px solid var(--ink); border-radius: 999px; transition: all .2s; }
  .gh-cta:hover { background: var(--ink); color: var(--bg); }

  /* Modal */
  .modal-bg {
    position: fixed; inset: 0; background: color-mix(in oklab, var(--ink) 50%, transparent);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 40px;
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--bg); max-width: 720px; width: 100%; max-height: 80vh; overflow-y: auto;
    padding: 48px; border: 1px solid var(--rule);
    animation: slideUp .25s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-head { display: flex; justify-content: space-between; align-items: start; margin-bottom: 24px; }
  .modal-close { background: none; border: none; cursor: pointer; font-size: 24px; color: var(--ink-3); padding: 0; line-height: 1; }
  .modal-close:hover { color: var(--ink); }
  .modal h3 { font-family: var(--display); font-size: 36px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 6px; }
  .modal .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 16px; }
  .modal p { font-size: 15px; color: var(--ink-2); line-height: 1.65; }
  .modal h4 { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 28px 0 12px; font-weight: 500; }
  .modal ul { padding-left: 20px; }
  .modal ul li { font-size: 14.5px; color: var(--ink-2); margin-bottom: 6px; }
  .modal .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
  .modal .modal-foot { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--rule); display: flex; gap: 16px; align-items: center; }
  .modal .modal-foot a { font-family: var(--mono); font-size: 12px; color: var(--accent); border-bottom: 1px solid var(--accent); padding-bottom: 1px; }

  /* Reveal */
  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .7s ease, transform .7s ease; }
  .reveal.in { opacity: 1; transform: translateY(0); }

  .cta-mini {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 8px 14px; border: 1px solid var(--ink); border-radius: 999px;
    transition: all .2s;
  }
  .cta-mini:hover { background: var(--ink); color: var(--bg); }

  /* Marquee section divider */
  .marq {
    overflow: hidden; padding: 32px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    background: var(--bg-2);
  }
  .marq-track {
    display: flex; gap: 56px; animation: scroll 40s linear infinite;
